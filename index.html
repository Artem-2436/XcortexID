<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xcortex ID Authorization</title>
    <!-- Подключаем Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f0f1a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #00d2ff;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Анимированный фон */
        .background-animation {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0f0f1a 100%);
        }
        
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 10s infinite ease-in-out alternate;
        }
        .orb:nth-child(1) { width: 300px; height: 300px; background: #00d2ff; top: 10%; left: 10%; }
        .orb:nth-child(2) { width: 250px; height: 250px; background: #9b5de5; bottom: 10%; right: 10%; animation-delay: -5s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        /* Карточка авторизации (Glassmorphism) */
        .auth-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            width: 350px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            z-index: 10;
        }

        h1 { margin-top: 0; font-weight: 300; letter-spacing: 2px; color: var(--accent); }
        
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-size: 0.9em; color: var(--text-muted); }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: rgba(0,0,0,0.2);
            color: white;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input:focus { border-color: var(--accent); }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(90deg, #00d2ff, #9b5de5);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            margin-top: 10px;
        }
        button:hover { opacity: 0.9; transform: translateY(-2px); }
        button:active { transform: translateY(0); }

        .hidden { display: none !important; }
        
        /* Экран подтверждения "Continue as..." */
        #confirm-screen p { font-size: 1.2em; margin: 20px 0; }
        .user-avatar-placeholder {
            width: 80px; height: 80px;
            background: var(--glass-bg);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2em; color: var(--accent);
            border: 2px solid var(--glass-border);
        }
        
        .error-msg {
            color: #ff4444;
            font-size: 0.8em;
            margin-top: 10px;
            min-height: 1.2em;
        }
    </style>
</head>
<body>

    <div class="background-animation">
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <div class="auth-card">
        <h1>Xcortex ID</h1>
        
        <!-- Экран Логина -->
        <div id="login-screen">
            <p style="color:var(--text-muted)">Войдите в аккаунт Xcortex</p>
            <form id="login-form">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" required placeholder="you@example.com">
                </div>
                <div class="input-group">
                    <label>пароль</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit">Login</button>
                <div id="login-error" class="error-msg"></div>
            </form>
        </div>

        <!-- Экран Подтверждения ("Узнал браузер") -->
        <div id="confirm-screen" class="hidden">
            <div class="user-avatar-placeholder">👤</div>
            <p>Вы вошли как:</p>
            <h2 id="display-name" style="margin: 10px 0;">User Name</h2>
            <p style="font-size: 0.9em; color: var(--text-muted);">Разрешить доступ к сайту?</p>
            <button id="continue-btn">Продолжить</button>
            <button id="logout-btn" style="background: transparent; border: 1px solid var(--glass-border); margin-top: 10px;">Не я / Выйти</button>
        </div>
    </div>

    <script>
    // --- КОНФИГУРАЦИЯ SUPABASE ---
    const SUPABASE_URL = 'https://ifsokgkfatghsxeoqofl.supabase.co'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_WlIcNs2dJz_Se_wJEXM-FA_5IFGi8OL'; 

    let xcAuthClient; 

    // Инициализация клиента
    try {
        if (typeof window.supabase !== 'undefined' && typeof window.supabase.createClient === 'function') {
            xcAuthClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log("✅ Xcortex Auth Client initialized successfully");
        } else {
            throw new Error("Supabase object or createClient method missing.");
        }
    } catch (err) {
        console.error("❌ Critical Initialization Error:", err);
        document.querySelector('.auth-card').innerHTML = '<h2 style="color:red">Ошибка загрузки</h2><p>' + err.message + '</p>';
    }

    // Элементы DOM
    const loginScreen = document.getElementById('login-screen');
    const confirmScreen = document.getElementById('confirm-screen');
    const displayNameEl = document.getElementById('display-name');
    const loginForm = document.getElementById('login-form');
    const continueBtn = document.getElementById('continue-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const loginErrorEl = document.getElementById('login-error');

    // Глобальная переменная для хранения токена до момента редиректа
    window.currentToken = null;

    /**
     * Функция получения URL для редиректа из query параметров (?redirect=...)
     * Если параметра нет, возвращаем null (значит, нужно остаться здесь или показать ошибку)
     */
    function getRedirectUrl() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('redirect');
    }

    // Функция проверки текущей сессии при загрузке страницы
    async function checkSession() {
        if (!xcAuthClient) return;

        try {
            const { data: { session }, error } = await xcAuthClient.auth.getSession();
            
            if (error || !session) {
                showLogin();
            } else {
                let userName = session.user.email.split('@')[0]; 
                if (session.user.user_metadata && session.user.user_metadata.full_name) {
                    userName = session.user.user_metadata.full_name;
                }
                
                // Сохраняем токен глобально
                window.currentToken = session.access_token;
                
                // Показываем экран подтверждения
                showConfirm(userName);
            }
        } catch (err) {
            console.error("Session check failed:", err);
            showLogin();
        }
    }

    function showLogin() {
        if(loginScreen) loginScreen.classList.remove('hidden');
        if(confirmScreen) confirmScreen.classList.add('hidden');
    }

    function showConfirm(name) {
        if(loginScreen) loginScreen.classList.add('hidden');
        if(confirmScreen) confirmScreen.classList.remove('hidden');
        if(displayNameEl) displayNameEl.textContent = name;
    }

    // Обработчик формы логина
    if (loginForm) {
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if(loginErrorEl) loginErrorEl.textContent = ''; 
            
            const emailInput = document.getElementById('email');
            const passInput = document.getElementById('password');
            
            if(!emailInput || !passInput) return;

            const email = emailInput.value;
            const password = passInput.value;

            if (!xcAuthClient) {
                if(loginErrorEl) loginErrorEl.textContent = "Система не готова.";
                return;
            }

            try {
                const { data, error } = await xcAuthClient.auth.signInWithPassword({ email, password });

                if (error) {
                    if(loginErrorEl) loginErrorEl.textContent = error.message;
                    return;
                }

                let userName = email.split('@')[0];
                if (data.user.user_metadata && data.user.user_metadata.full_name) {
                    userName = data.user.user_metadata.full_name;
                }

                // Сохраняем токен
                window.currentToken = data.session.access_token;
                
                // Переходим к подтверждению
                showConfirm(userName);
            } catch (err) {
                if(loginErrorEl) loginErrorEl.textContent = "Непредвиденная ошибка";
                console.error(err);
            }
        });
    }

    // Кнопка "Продолжить" — Теперь динамическая!
    if (continueBtn) {
        continueBtn.addEventListener('click', () => {
            if (!window.currentToken) return;

            // Получаем URL, откуда нас прислали
            const targetUrl = getRedirectUrl();

            if (targetUrl) {
                // Декодируем URL на случай, если он был закодирован
                let decodedTarget = decodeURIComponent(targetUrl);
                
                // Проверяем безопасность: разрешаем только http/https ссылки
                if (!decodedTarget.startsWith('http')) {
                     alert("Небезопасный URL для редиректа");
                     return;
                }

                // Добавляем токен в конец URL через хэш (#token=...)
                // Хэш используется, потому что сервер не видит данные после него, это безопасно и быстро
                const finalUrl = `${decodedTarget}#token=${encodeURIComponent(window.currentToken)}`;
                
                window.location.href = finalUrl;
            } else {
                // Если redirect не указан, можно либо оставить на странице, либо показать сообщение
                alert("Не указан адрес возврата (parameter ?redirect=). Проверьте ссылку входа.");
            }
        });
    }

    // Кнопка "Выход"
    if (logoutBtn) {
        logoutBtn.addEventListener('click', async () => {
            if (xcAuthClient) {
                await xcAuthClient.auth.signOut();
            }
            location.reload(); 
        });
    }

    // Запуск при загрузке
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', checkSession);
    } else {
        checkSession();
    }
</script>
</body>
</html>
