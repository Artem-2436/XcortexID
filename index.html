<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xcortex ID Authorization</title>
    <!-- Подключаем Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f0f1a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #00d2ff;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Анимированный фон */
        .background-animation {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0f0f1a 100%);
        }
        
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: float 10s infinite ease-in-out alternate;
        }
        .orb:nth-child(1) { width: 300px; height: 300px; background: #00d2ff; top: 10%; left: 10%; }
        .orb:nth-child(2) { width: 250px; height: 250px; background: #9b5de5; bottom: 10%; right: 10%; animation-delay: -5s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        /* Карточка авторизации (Glassmorphism) */
        .auth-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            width: 350px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            transition: all 0.3s ease;
        }

        h1 { margin-top: 0; font-weight: 300; letter-spacing: 2px; color: var(--accent); }
        
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-size: 0.9em; color: var(--text-muted); }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: rgba(0,0,0,0.2);
            color: white;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        input:focus { border-color: var(--accent); }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(90deg, #00d2ff, #9b5de5);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            margin-top: 10px;
        }
        button:hover { opacity: 0.9; transform: translateY(-2px); }
        button:active { transform: translateY(0); }

        .hidden { display: none !important; }
        
        /* Экран подтверждения "Continue as..." */
        #confirm-screen p { font-size: 1.2em; margin: 20px 0; }
        .user-avatar-placeholder {
            width: 80px; height: 80px;
            background: var(--glass-bg);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2em; color: var(--accent);
            border: 2px solid var(--glass-border);
        }
    </style>
</head>
<body>

    <div class="background-animation">
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <div class="auth-card">
        <h1>Xcortex ID</h1>
        
        <!-- Экран Логина (по умолчанию скрыт, если есть сессия) -->
        <div id="login-screen">
            <p style="color:var(--text-muted)">Войдите в аккаунт Xcortex</p>
            <form id="login-form">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" required placeholder="you@example.com">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit">Login</button>
            </form>
        </div>

        <!-- Экран Подтверждения ("Узнал браузер") -->
        <div id="confirm-screen" class="hidden">
            <div class="user-avatar-placeholder">👤</div>
            <p>Вы вошли как:</p>
            <h2 id="display-name" style="margin: 10px 0;">User Name</h2>
            <p style="font-size: 0.9em; color: var(--text-muted);">Разрешить доступ к сайту?</p>
            <button id="continue-btn">Продолжить</button>
            <button id="logout-btn" style="background: transparent; border: 1px solid var(--glass-border); margin-top: 10px;">Не я / Выйти</button>
        </div>
    </div>

    <script>
        // --- КОНФИГУРАЦИЯ SUPABASE ---
const SUPABASE_URL = 'https://ifsokgkfatghsxeoqofl.supabase.co'; // ЗАМЕНИ НА СВОЙ URL
const SUPABASE_ANON_KEY = 'sb_publishable_WlIcNs2dJz_Se_wJEXM-FA_5IFGi8OL'; // ЗАМЕНИ НА СВОЙ KEY

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Элементы DOM
const loginScreen = document.getElementById('login-screen');
const confirmScreen = document.getElementById('confirm-screen');
const displayNameEl = document.getElementById('display-name');
const loginForm = document.getElementById('login-form');
const continueBtn = document.getElementById('continue-btn');
const logoutBtn = document.getElementById('logout-btn');

// Функция проверки текущей сессии
async function checkSession() {
    const { data: { session }, error } = await supabase.auth.getSession();
    
    if (error || !session) {
        showLogin();
    } else {
        // Браузер "узнал" пользователя (есть активная сессия в этом домене)
        // Но нам нужно получить профиль (имя), если оно не в metadata
        let userName = session.user.email.split('@')[0]; // Дефолтное имя
        
        try {
            // Пытаемся получить имя из таблицы profiles (если она настроена)
            const { data: profile } = await supabase.from('profiles').select('*').eq('id', session.user.id).single();
            if (profile && profile.full_name) {
                userName = profile.full_name;
            }
        } catch (e) {
            console.log("No profile table or permission denied, using email prefix.");
        }

        showConfirm(userName, session.access_token);
    }
}

function showLogin() {
    loginScreen.classList.remove('hidden');
    confirmScreen.classList.add('hidden');
}

function showConfirm(name, token) {
    loginScreen.classList.add('hidden');
    confirmScreen.classList.remove('hidden');
    displayNameEl.textContent = name;
    
    // Сохраняем токен во временную переменную для кнопки Continue
    window.currentToken = token; 
}

// Обработчик формы логина
loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    const { data, error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
        alert('Ошибка входа: ' + error.message);
        return;
    }

    // Успешный вход, обновляем UI
    let userName = email.split('@')[0];
    // Опционально: снова проверить профиль для имени
    const { data: profile } = await supabase.from('profiles').select('full_name').eq('id', data.user.id).single();
    if (profile?.full_name) userName = profile.full_name;

    showConfirm(userName, data.session.access_token);
});

// Кнопка "Продолжить"
continueBtn.addEventListener('click', () => {
    if (!window.currentToken) return;

    // ВАЖНО: Здесь происходит перенаправление обратно на основной сайт.
    // Ты должен указать URL своего основного сайта (где находится кнопка Sign In).
    const MAIN_SITE_URL = 'http://localhost:3000'; // Или твой прод адрес
    
    // Добавляем токен в хэш URL
    // Формат: https://main-site.com/#access_token=JWT_TOKEN&expires_at=...
    // Для простоты передадим только токен и тип ответа
    const redirectUrl = `${MAIN_SITE_URL}/#/xcortex_callback?token=${encodeURIComponent(window.currentToken)}`;
    
    window.location.href = redirectUrl;
});

// Кнопка "Не я / Выйти"
logoutBtn.addEventListener('click', async () => {
    await supabase.auth.signOut();
    location.reload(); // Перезагружаем страницу, чтобы показать форму логина
});

// Запуск при загрузке
checkSession();
    </script>
</body>
</html>
